<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MOSS Note - 로그인</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f7f8; color: #20282b; font: 16px system-ui, sans-serif; }
    main { width: min(360px, calc(100% - 40px)); margin: 16vh auto 40px; }
    h1 { font-size: 28px; margin-bottom: 32px; }
    label { display: block; font-size: 14px; margin: 20px 0 8px; }
    input { width: 100%; padding: 12px; border: 1px solid #b8c2c8; border-radius: 4px; font: inherit; background: white; }
    input:focus { outline: 2px solid #147d70; outline-offset: 2px; }
    button { width: 100%; margin-top: 24px; padding: 12px; border: 0; border-radius: 4px; background: #147d70; color: white; font: inherit; cursor: pointer; }
    .error { color: #a12736; font-size: 14px; }
    .error:empty { display: none; }
  </style>
</head>
<body>
  <main>
    <h1>MOSS Note</h1>
    <p class="error" role="alert">__ERROR__</p>
    <form action="/login" method="post">
      <input type="hidden" name="csrf" value="__CSRF__">
      <label for="username">아이디</label>
      <input id="username" name="username" autocomplete="username" required autofocus>
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">로그인</button>
    </form>
  </main>
</body>
</html>
